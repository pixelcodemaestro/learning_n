name: Build and Deploy to AKS

on:
  push:
    branches:
      - deployment

env:
  APP_NAME: siluku
  IMAGE_NAME: siluku
  NAMESPACE: test
  PROJECT_DIR: Demo-project

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -f "${{ env.PROJECT_DIR }}/Dockerfile" \
            "${{ env.PROJECT_DIR }}"

      - name: Push Docker Image
        run: |
          docker push \
            ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Replace Variables
        run: |
          IMAGE=${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

          sed -i "s|IMAGE_PLACEHOLDER|$IMAGE|g" "${{ env.PROJECT_DIR }}/k8s/deployment.yaml"

          sed -i "s|APP_NAME|${{ env.APP_NAME }}|g" "${{ env.PROJECT_DIR }}/k8s/deployment.yaml"

          sed -i "s|APP_NAME|${{ env.APP_NAME }}|g" "${{ env.PROJECT_DIR }}/k8s/service.yaml"

      - name: Deploy
        run: |
          kubectl apply -f "${{ env.PROJECT_DIR }}/k8s/"

      - name: Verify Rollout
        run: |
          kubectl rollout status deployment/${{ env.APP_NAME }} \
            -n ${{ env.NAMESPACE }}

      - name: Setup Node.js
        if: success()
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Azure Communication Email SDK
        if: success()
        run: |
          npm install @azure/communication-email

      - name: Send Deployment Success Email
        if: success()
        env:
          ACS_CONNECTION_STRING: ${{ secrets.ACS_CONNECTION_STRING }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          APP_NAME: ${{ env.APP_NAME }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
        run: |
          cat > send-email.mjs <<'EOF'
          import { EmailClient } from "@azure/communication-email";

          const client = new EmailClient(process.env.ACS_CONNECTION_STRING);

          const message = {
            senderAddress: process.env.EMAIL_FROM,
            recipients: {
              to: [
                {
                  address: process.env.EMAIL_TO
                }
              ]
            },
            content: {
              subject: `✅ Deployment Successful - ${process.env.APP_NAME}`,
              plainText: `
          Application : ${process.env.APP_NAME}

          Repository : ${process.env.REPOSITORY}

          Branch : ${process.env.BRANCH}

          Commit : ${process.env.IMAGE_TAG}

          Triggered By : ${process.env.ACTOR}

          Status : SUCCESS

          GitHub Run :
          https://github.com/${process.env.REPOSITORY}/actions/runs/${process.env.RUN_ID}
          `,
                  html: `
          <h2>✅ Deployment Successful</h2>

          <table border="1" cellpadding="8" cellspacing="0">
          <tr><td><b>Application</b></td><td>${process.env.APP_NAME}</td></tr>
          <tr><td><b>Repository</b></td><td>${process.env.REPOSITORY}</td></tr>
          <tr><td><b>Branch</b></td><td>${process.env.BRANCH}</td></tr>
          <tr><td><b>Commit</b></td><td>${process.env.IMAGE_TAG}</td></tr>
          <tr><td><b>Triggered By</b></td><td>${process.env.ACTOR}</td></tr>
          <tr><td><b>Status</b></td><td style="color:green;"><b>SUCCESS</b></td></tr>
          </table>

          <br>

          <a href="https://github.com/${process.env.REPOSITORY}/actions/runs/${process.env.RUN_ID}">
          View GitHub Action Run
          </a>
          `
                }
              };

              const poller = await client.beginSend(message);
              const response = await poller.pollUntilDone();

              console.log(response);
              EOF

              node send-email.mjs

      - name: Verify Pods
        run: |
          kubectl get pods -n test

      - name: Verify Services
        run: |
          kubectl get svc -n test



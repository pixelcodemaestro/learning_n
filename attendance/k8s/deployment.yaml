apiVersion: apps/v1
kind: Deployment

metadata:
  name: iphonev2
  namespace: marathi
spec:
  replicas: 1

  selector:
    matchLabels:
      app: iphonev2

  template:
    metadata:
      labels:
        app: iphonev2

    spec:
      containers:
      - name: iphonev2

        image: imsprasanth/kkl:1

        ports:
        - containerPort: 3000
      resources:

        requests:
          cpu: "100m"
          memory: "128Mi"

        limits:
          cpu: "500m"
          memory: "256Mi"


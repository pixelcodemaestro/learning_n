apiVersion: v1
kind: Pod
metadata:
  name: multi-container-demo
spec:
  volumes:
    - name: shared-data
      emptyDir: {}

  containers:

  - name: nginx
    image: nginx:latest

    ports:
    - containerPort: 80

    volumeMounts:
    - name: shared-data
      mountPath: /usr/share/nginx/html

  - name: busybox
    image: busybox
    command:
      - /bin/sh
      - -c
      - |
        while true
        do
          date > /shared/index.html
          sleep 5
        done

    volumeMounts:
    - name: shared-data
      mountPath: /shared